<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament Billiard Rainbow Season 2 2026</title>
<meta name="description" content="Official Tournament Billiard Rainbow Season 2 2026 - 9 Ball, 32 Players, Double Elimination.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rye&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="lamp" aria-hidden="true"></div>

<header class="board">
  <span class="badge">★ OFFICIAL TOURNAMENT 2026 ★</span>
  <div class="balls" id="heroBalls" aria-hidden="true"></div>
  <h1>Tournament<br><span>Billiard Rainbow</span></h1>
  <p class="season">SEASON 2 &bull; 2026</p>
  <div class="chips">
    <span class="chip">9 BALL</span>
    <span class="chip">32 PLAYERS</span>
    <span class="chip">DOUBLE ELIMINATION</span>
  </div>
</header>

<div class="ticker" role="marquee" aria-label="Ucapan selamat datang">
  <div class="ticker-track" id="ticker"></div>
</div>

<main>
  <section>
    <h2 class="title">Sponsor Resmi</h2>
    <div class="sponsors" id="sponsors"></div>
  </section>

  <section>
    <h2 class="title">Daftar 32 Peserta</h2>
    <div class="tools">
      <input id="search" type="search" placeholder="Cari nama peserta..." aria-label="Cari peserta">
      <span class="count" id="count">32 / 32</span>
    </div>
    <div class="players" id="players"></div>
    <p class="empty" id="empty" hidden>Peserta tidak ditemukan. Coba nama lain.</p>
  </section>
</main>

<footer>
  <p>Tournament Billiard Rainbow Season 2 &copy; 2026 &bull; Main bagus, jaga sportivitas.</p>
</footer>
<script src="script.js"></script>
</body>
</html>
